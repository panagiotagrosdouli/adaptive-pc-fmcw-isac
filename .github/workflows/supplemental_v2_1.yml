name: Supplemental Publication V2.1 Reviewer Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/supplemental-v2-1.trigger'
      - 'src/pcfmcw_isac/if_model.py'
      - 'src/pcfmcw_isac/profiles.py'
      - 'src/pcfmcw_isac/profile_selection.py'
      - 'src/pcfmcw_isac/publication_protocol.py'
      - 'src/pcfmcw_isac/policy_evaluation.py'
      - 'src/pcfmcw_isac/policy_v2_1.py'
      - 'src/pcfmcw_isac/publication_benchmark.py'
      - 'src/pcfmcw_isac/publication_benchmark_v2.py'
      - 'src/pcfmcw_isac/part_b_completion.py'
      - 'src/pcfmcw_isac/supplemental_evidence_v2_1.py'
      - 'src/pcfmcw_isac/research_extensions.py'
      - 'src/pcfmcw_isac/research_analysis.py'
      - 'src/pcfmcw_isac/research_sensitivity.py'
      - 'scripts/run_supplemental_v2_1.py'
      - 'scripts/check_research_submission_gate.py'
      - 'scripts/generate_supplemental_v2_1_figures.py'
      - 'scripts/generate_research_tables.py'
      - 'scripts/summarize_research_evidence.py'
      - '.github/workflows/supplemental_v2_1.yml'

concurrency:
  group: supplemental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        experiment: [uncertainty, stress, physics, pareto, ablations, mismatch, distribution-shift, runtime, full-metrics, reliability-targets, qos-sensitivity, confidence-maps, uncertainty-sources, reliability-calibration, action-space]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .[dev]
      - name: Run supplemental experiment
        run: |
          if [ "${{ matrix.experiment }}" = "physics" ]; then
            python scripts/run_supplemental_v2_1.py --experiment physics --n-seeds 1 --output artifacts/supplemental/${{ matrix.experiment }}.json
          elif [ "${{ matrix.experiment }}" = "runtime" ]; then
            python scripts/run_supplemental_v2_1.py --experiment runtime --seed-start 10000 --n-seeds 10 --output artifacts/supplemental/${{ matrix.experiment }}.json
          elif [ "${{ matrix.experiment }}" = "reliability-calibration" ]; then
            python scripts/run_supplemental_v2_1.py --experiment reliability-calibration --seed-start 10000 --n-seeds 100 --reference-draws 4096 --output artifacts/supplemental/${{ matrix.experiment }}.json
          elif [ "${{ matrix.experiment }}" = "distribution-shift" ]; then
            python scripts/run_supplemental_v2_1.py --experiment distribution-shift --seed-start 10000 --n-seeds 100 --comm-bits 5000 --sensing-trials 1 --robust-draws 256 --truth-draws 4 --bootstrap-resamples 10000 --output artifacts/supplemental/${{ matrix.experiment }}.json
          else
            python scripts/run_supplemental_v2_1.py --experiment ${{ matrix.experiment }} --seed-start 10000 --n-seeds 100 --comm-bits 5000 --sensing-trials 1 --robust-draws 256 --output artifacts/supplemental/${{ matrix.experiment }}.json
          fi
      - name: Upload supplemental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-v2-1-${{ matrix.experiment }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/supplemental/${{ matrix.experiment }}.json
          if-no-files-found: error
          retention-days: 90

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .[dev]
      - name: Run all supplemental paths as smoke
        run: python scripts/run_supplemental_v2_1.py --experiment all-smoke --seed-start 10000 --n-seeds 2 --comm-bits 1000 --sensing-trials 1 --robust-draws 32 --reference-draws 128 --truth-draws 1 --bootstrap-resamples 200 --output artifacts/supplemental/all_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: supplemental-v2-1-smoke-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/supplemental/all_smoke.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [supplemental, smoke]
    if: ${{ always() && needs.supplemental.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .[all]
      - name: Download experiment artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supplemental-v2-1-*-${{ github.sha }}-${{ github.run_id }}
          path: downloaded-artifacts
          merge-multiple: true
      - name: Assemble machine-readable research evidence
        run: |
          mkdir -p artifacts/research
          find downloaded-artifacts -type f -name '*.json' -print -exec cp {} artifacts/research/ \;
          echo 'Collected research artifacts:'
          find artifacts/research -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort
      - name: Enforce fail-closed submission evidence gate
        run: python scripts/check_research_submission_gate.py --input-dir artifacts/research --output artifacts/research/submission-gate.json
      - name: Derive conservative scientific verdict
        run: python scripts/summarize_research_evidence.py --input-dir artifacts/research --output artifacts/research/scientific-verdict.json --bootstrap-resamples 10000
      - name: Generate artifact-driven figures
        run: python scripts/generate_supplemental_v2_1_figures.py --input-dir artifacts/research --output-dir artifacts/research/figures
      - name: Generate artifact-driven tables
        run: python scripts/generate_research_tables.py --input-dir artifacts/research --output-dir artifacts/research/tables
      - name: Build evidence manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts/research')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              files.append({
                  'path': str(path.relative_to(root)),
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          manifest = {
              'evidence_class': 'SUPPLEMENTAL_PUBLICATION_V2_1_SIMULATION_NOT_HARDWARE_MEASUREMENT',
              'git_sha': '${{ github.sha }}',
              'github_run_id': '${{ github.run_id }}',
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Upload complete research evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-bundle-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/research
          if-no-files-found: error
          retention-days: 90
