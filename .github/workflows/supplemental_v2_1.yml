name: Supplemental Publication V2.1 Reviewer Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/supplemental-v2-1.trigger'

jobs:
  supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        experiment: [uncertainty, stress, physics, pareto, ablations, mismatch, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - name: Run supplemental experiment
        run: |
          if [ "${{ matrix.experiment }}" = "physics" ]; then
            python scripts/run_supplemental_v2_1.py \
              --experiment physics \
              --n-seeds 1 \
              --output artifacts/supplemental/${{ matrix.experiment }}.json
          elif [ "${{ matrix.experiment }}" = "runtime" ]; then
            python scripts/run_supplemental_v2_1.py \
              --experiment runtime \
              --seed-start 10000 \
              --n-seeds 10 \
              --output artifacts/supplemental/${{ matrix.experiment }}.json
          else
            python scripts/run_supplemental_v2_1.py \
              --experiment ${{ matrix.experiment }} \
              --seed-start 10000 \
              --n-seeds 100 \
              --comm-bits 5000 \
              --sensing-trials 1 \
              --robust-draws 256 \
              --output artifacts/supplemental/${{ matrix.experiment }}.json
          fi
      - name: Upload supplemental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-v2-1-${{ matrix.experiment }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/supplemental/${{ matrix.experiment }}.json
          retention-days: 90

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - name: Run all supplemental paths as smoke
        run: |
          python scripts/run_supplemental_v2_1.py \
            --experiment all-smoke \
            --seed-start 10000 \
            --n-seeds 2 \
            --comm-bits 1000 \
            --sensing-trials 1 \
            --robust-draws 32 \
            --output artifacts/supplemental/all_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: supplemental-v2-1-smoke-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/supplemental/all_smoke.json
          retention-days: 90
