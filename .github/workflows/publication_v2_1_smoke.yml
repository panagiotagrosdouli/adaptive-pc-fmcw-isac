name: Publication V2.1 Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/publication-v2-1-smoke.trigger'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Run frozen v2.1 smoke gate
        run: python scripts/run_v2_1_smoke.py --output artifacts/publication/v2_1_smoke.json
      - name: Enforce v2.1 sanity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/publication/v2_1_smoke.json').read_text())
          gate = data['sanity_gate']
          if not all(gate.values()):
              raise SystemExit(f'v2.1 smoke gate failed: {gate}')
          print('v2.1 smoke gate passed:', gate)
          PY
      - name: Record provenance
        run: |
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          p = Path('artifacts/publication')
          p.mkdir(parents=True, exist_ok=True)
          data = {
              'evidence_class': 'PUBLICATION_V2_1_SMOKE_SIMULATION_NOT_FINAL_PAPER_RESULT',
              'protocol_id': 'pcfmcw_isac_paper_v2_1',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'python': sys.version,
              'platform': platform.platform(),
          }
          (p/'v2_1_smoke_provenance.json').write_text(json.dumps(data, indent=2))
          PY
      - name: Upload v2.1 smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publication-v2-1-smoke-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/publication/v2_1_smoke.json
            artifacts/publication/v2_1_smoke_provenance.json
          retention-days: 90
