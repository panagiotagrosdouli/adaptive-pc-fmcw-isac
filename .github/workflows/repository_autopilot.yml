name: Repository Autopilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke or submission'
        required: true
        default: 'submission'
        type: choice
        options:
          - smoke
          - submission
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'configs/**'
      - 'paper/**'
      - 'docs/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'configs/**'
      - 'paper/**'
      - 'docs/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/**'

concurrency:
  group: repository-autopilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python and TeX dependencies
        run: |
          python -m pip install -e .[all]
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-science texlive-fonts-recommended texlive-publishers
      - name: Run repository autopilot
        run: |
          MODE='${{ github.event.inputs.mode }}'
          if [ -z "$MODE" ]; then MODE=submission; fi
          python scripts/run_repository_autopilot.py --mode "$MODE" --status artifacts/autopilot/status.json
      - name: Check frozen evidence was not rewritten
        run: |
          git diff --exit-code -- artifacts/publication/v2_1
      - name: Upload autopilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-autopilot-${{ github.sha }}
          path: |
            artifacts/autopilot/**
            artifacts/publication/submission/**
            paper/paper1_ieee.pdf
            paper/paper2_ieee.pdf
          if-no-files-found: warn
          retention-days: 30
