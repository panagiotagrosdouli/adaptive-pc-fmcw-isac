name: predictive-stage-tests

on:
  push:
    branches:
      - research/predictive-stage-code-layout
      - research/stage05-official-predictor-evaluation
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,learning]"
      - name: Run predictive Stage 0-5 tests
        run: |
          pytest -q \
            stages/00_freeze_and_provenance/tests \
            stages/01_womd_data_pipeline/test_audit_corpus.py \
            stages/01_womd_data_pipeline/test_export_contract.py \
            stages/02_pc_fmcw_dpsk_link/test_link_model.py \
            stages/02_pc_fmcw_dpsk_link/test_part_a_receiver.py \
            stages/03_classical_baselines/test_predictors.py \
            stages/03_classical_baselines/test_evaluate_predictors.py \
            stages/03_classical_baselines/test_schedulers.py \
            stages/04_communication_aware_gru/test_calibration.py \
            stages/04_communication_aware_gru/test_evidence_gate.py \
            stages/05_official_predictor_evaluation
