name: Stage 06 current architecture

on:
  pull_request:
    paths:
      - 'stages/06_packet_scheduling/**'
      - '.github/workflows/stage06-current.yml'
  push:
    branches: [main]
    paths:
      - 'stages/06_packet_scheduling/**'
      - '.github/workflows/stage06-current.yml'

jobs:
  stage06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q stages/06_packet_scheduling/test_simulator.py
