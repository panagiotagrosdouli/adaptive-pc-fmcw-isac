name: Manuscript LaTeX Audit

on:
  pull_request:
    paths:
      - 'paper/**'
      - 'docs/SUBMISSION_V2_1_RELEASE.md'
      - 'scripts/build_submission_bundle.py'
      - 'scripts/build_submission_manifest.py'
      - 'Makefile'
      - '.github/workflows/manuscript_latex.yml'
  push:
    branches:
      - main
    paths:
      - 'paper/**'
      - 'docs/SUBMISSION_V2_1_RELEASE.md'
      - 'scripts/build_submission_bundle.py'
      - 'scripts/build_submission_manifest.py'
      - 'Makefile'
      - '.github/workflows/manuscript_latex.yml'
  workflow_dispatch:

# TeX installation/builds are comparatively expensive. Only the newest
# manuscript audit is useful for submission readiness; stale queued/running
# manuscript builds are cancelled when a newer manuscript state is pushed.
concurrency:
  group: manuscript-latex-${{ github.repository }}
  cancel-in-progress: true

jobs:
  latex-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e .[dev]
      - name: Validate submission source manifest
        working-directory: paper
        run: |
          set -euo pipefail
          test -s SUBMISSION_SOURCE_MANIFEST.txt
          while IFS= read -r source; do
            [ -z "$source" ] && continue
            case "$source" in
              /*|*..*) echo "Unsafe manifest path: $source"; exit 1 ;;
            esac
            test -f "$source" || { echo "Missing submission source: $source"; exit 1; }
          done < SUBMISSION_SOURCE_MANIFEST.txt
          for required in manuscript_v2_1.tex references_v2_1.bib final_abstract_conclusion_abstract_only.tex final_abstract_conclusion_conclusion_only.tex results_v2_1_tables.tex supplemental_v2_1_tables.tex final_results_discussion.tex figures_submission.tex literature_positioning.tex; do
            grep -Fxq "$required" SUBMISSION_SOURCE_MANIFEST.txt || { echo "Manifest omits required source: $required"; exit 1; }
          done
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-science texlive-fonts-recommended texlive-publishers
      - name: Build IEEE manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error manuscript_v2_1.tex
      - name: Fail on unresolved citations or references
        working-directory: paper
        run: |
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" manuscript_v2_1.log; then
            echo 'Unresolved citation/reference detected.'
            exit 1
          fi
      - name: Fail on multiply-defined labels
        working-directory: paper
        run: |
          if grep -E "multiply defined|There were multiply-defined labels" manuscript_v2_1.log; then
            echo 'Multiply-defined LaTeX label detected.'
            exit 1
          fi
      - name: Report layout warnings
        working-directory: paper
        run: |
          grep -E "Overfull \\hbox|Underfull \\hbox" manuscript_v2_1.log || true
      - name: Export frozen submission action space
        run: python scripts/export_submission_action_space.py --output artifacts/publication/submission/action_space.csv
      - name: Build submission provenance manifest
        run: python scripts/build_submission_manifest.py --commit "${GITHUB_SHA}" --output artifacts/publication/submission/manifest.json
      - name: Build deterministic submission bundle
        run: python scripts/build_submission_bundle.py --output artifacts/publication/submission/adaptive-pc-fmcw-isac-submission-v2.1.zip
      - name: Validate submission bundle
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('artifacts/publication/submission/adaptive-pc-fmcw-isac-submission-v2.1.zip')
          assert p.is_file() and p.stat().st_size > 0
          with zipfile.ZipFile(p) as zf:
              bad = zf.testzip()
              assert bad is None, f'corrupt ZIP member: {bad}'
              names = set(zf.namelist())
              for required in (
                  'paper/manuscript_v2_1.pdf',
                  'artifacts/publication/v2_1/FINAL_RESULTS.json',
                  'artifacts/publication/submission/manifest.json',
                  'SUBMISSION_COMMIT.txt',
              ):
                  assert required in names, f'missing bundle member: {required}'
          print(f'validated {p} ({p.stat().st_size} bytes)')
          PY
      - name: Upload compiled manuscript, bundle, and log
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-v2-1-submission
          if-no-files-found: error
          path: |
            paper/manuscript_v2_1.pdf
            paper/manuscript_v2_1.log
            paper/SUBMISSION_SOURCE_MANIFEST.txt
            artifacts/publication/submission/action_space.csv
            artifacts/publication/submission/manifest.json
            artifacts/publication/submission/adaptive-pc-fmcw-isac-submission-v2.1.zip
