name: Manuscript LaTeX Audit

on:
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/manuscript_latex.yml'
  workflow_dispatch:

jobs:
  latex-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate submission source manifest
        working-directory: paper
        run: |
          set -euo pipefail
          test -s SUBMISSION_SOURCE_MANIFEST.txt
          while IFS= read -r source; do
            [ -z "$source" ] && continue
            case "$source" in
              /*|*..*) echo "Unsafe manifest path: $source"; exit 1 ;;
            esac
            test -f "$source" || { echo "Missing submission source: $source"; exit 1; }
          done < SUBMISSION_SOURCE_MANIFEST.txt
          for required in manuscript_v2_1.tex references_v2_1.bib final_abstract_conclusion_abstract_only.tex final_abstract_conclusion_conclusion_only.tex results_v2_1_tables.tex supplemental_v2_1_tables.tex final_results_discussion.tex; do
            grep -Fxq "$required" SUBMISSION_SOURCE_MANIFEST.txt || { echo "Manifest omits required source: $required"; exit 1; }
          done
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-science texlive-fonts-recommended texlive-publishers
      - name: Build IEEE manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error manuscript_v2_1.tex
      - name: Fail on unresolved citations or references
        working-directory: paper
        run: |
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" manuscript_v2_1.log; then
            echo 'Unresolved citation/reference detected.'
            exit 1
          fi
      - name: Fail on multiply-defined labels
        working-directory: paper
        run: |
          if grep -E "multiply defined|There were multiply-defined labels" manuscript_v2_1.log; then
            echo 'Multiply-defined LaTeX label detected.'
            exit 1
          fi
      - name: Report layout warnings
        working-directory: paper
        run: |
          grep -E "Overfull \\hbox|Underfull \\hbox" manuscript_v2_1.log || true
      - name: Upload compiled manuscript and log
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-v2-1-pdf
          if-no-files-found: error
          path: |
            paper/manuscript_v2_1.pdf
            paper/manuscript_v2_1.log
            paper/SUBMISSION_SOURCE_MANIFEST.txt
