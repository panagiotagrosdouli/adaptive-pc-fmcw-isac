name: predictive-stage-tests

on:
  push:
    branches:
      - research/predictive-stage-code-layout
      - research/stage05-official-predictor-evaluation
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,learning]"
      - name: Run predictive Stage 0-5 tests
        run: |
          pytest -q \
            predictive_stage0/tests \
            predictive_stage1/test_audit_corpus.py \
            predictive_stage1/test_export_contract.py \
            predictive_stage2/test_link_model.py \
            predictive_stage2/test_part_a_receiver.py \
            predictive_stage3/test_predictors.py \
            predictive_stage3/test_evaluate_predictors.py \
            predictive_stage3/test_schedulers.py \
            predictive_stage4/test_calibration.py \
            predictive_stage4/test_evidence_gate.py \
            stages/05_official_predictor_evaluation
